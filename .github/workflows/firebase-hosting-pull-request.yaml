name: Preview to Firebase Hosting (PR)

# Preview channels deploy in **fake mode**: Vite builds against the synthetic
# backend (src/shared/api/fake-*.ts) so the preview URL is fully usable without
# Google sign-in. Real Firebase auth on preview channels would fail with
# `auth/unauthorized-domain` because Firebase Auth's authorized-domains list
# is exact-match and the channel URL hash rotates per deploy. The orange FAKE
# badge in the app bar makes it visually obvious that no production data is
# involved.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "firebase/**"
      - ".github/workflows/firebase-hosting-merge.yaml"

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify gates
        run: |
          bun run check
          bun run typecheck
          bun run test
          bun run build:fake

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCTORINA_TEST }}
          projectId: doctorina-test
          expires: 7d
          entryPoint: firebase
